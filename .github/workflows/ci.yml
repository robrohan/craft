name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # clang / cc build on Linux and macOS, plus the ASan/UBSan build and self-host
  posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Build (build.sh)
        run: sh build.sh

      - name: Version
        run: ./craft --version

      - name: Test suite (compared against GNU make)
        run: sh tests/run.sh --compare

      - name: ASan / UBSan build + tests
        run: |
          sh build.sh --debug
          CRAFT="$PWD/craft-debug" sh tests/run.sh

      - name: Self-host (craft builds craft)
        run: |
          ./craft -f Craftfile BIN=craft-selfhost
          CRAFT="$PWD/craft-selfhost" sh tests/run.sh

  # tcc build on Linux (mirrors the Windows toolchain on a testable platform)
  linux-tcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tcc
        run: sudo apt-get update && sudo apt-get install -y tcc

      - name: Build (CC=tcc)
        run: CC=tcc sh build.sh

      - name: Version
        run: ./craft --version

      - name: Test suite
        run: sh tests/run.sh

  # tcc build on Windows via build.bat - no Cygwin/MSYS in the build itself
  windows-tcc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch tcc
        shell: bash
        run: |
          set -e
          urls="
            http://download-mirror.savannah.gnu.org/releases/tinycc/tcc-0.9.27-win64-bin.zip
            https://download.savannah.gnu.org/releases/tinycc/tcc-0.9.27-win64-bin.zip
            https://download.savannah.nongnu.org/releases/tinycc/tcc-0.9.27-win64-bin.zip
          "
          for u in $urls; do
            echo "trying $u"
            if curl -fL --retry 3 --retry-all-errors -o tcc.zip "$u"; then ok=1; break; fi
          done
          [ -n "${ok:-}" ] || { echo "could not download tcc"; exit 1; }
          7z x -y tcc.zip
          ./tcc/tcc.exe -v

      - name: Build (build.bat)
        shell: cmd
        run: |
          set PATH=%CD%\tcc;%PATH%
          call build.bat

      - name: Version
        shell: cmd
        run: craft.exe --version

      # The tests/ golden suite uses POSIX-shell recipes, which is not how craft
      # is used on Windows.  Instead we drive a cmd.exe-native makefile - this is
      # what a real Windows user's recipes look like (echo, plain commands).
      - name: Smoke test (cmd.exe recipes)
        shell: bash
        run: |
          set -e
          cd tests/win-smoke
          craft=../../craft.exe

          echo "# default goal builds prereqs in order"
          "$craft" > got.txt 2>&1 || { cat got.txt; exit 1; }
          diff <(tr -d '\r' < expected-all.txt) <(tr -d '\r' < got.txt)

          echo "# command-line override + automatic variable"
          out=$("$craft" show NAME=hi | tr -d '\r')
          [ "$out" = "name=hi target=show" ] || { echo "got: [$out]"; exit 1; }

          echo "# a failing recipe stops the build with exit 2"
          set +e
          "$craft" boom > boom.txt 2>&1
          rc=$?
          set -e
          cat boom.txt
          [ "$rc" = 2 ] || { echo "expected rc 2, got $rc"; exit 1; }
          grep -q "starting" boom.txt
          grep -q "Error 1" boom.txt

          echo "ALL SMOKE CHECKS PASSED"
